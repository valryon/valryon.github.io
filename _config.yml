title: Damien Mayance (Valryon)

# -------------------------------------------------------
# Globals.
# -------------------------------------------------------

show_drafts: nil
permalink: /:title/

# -------------------------------------------------------
# Theme colors (rendered as CSS variables in _includes/meta.html)
# -------------------------------------------------------

colors:
  bg: "#0E1420"
  panel: "#141B2A"
  card: "#172032"
  card_hover: "#1E2A46"
  line: "rgba(148, 163, 184, 0.13)"
  line_strong: "rgba(148, 163, 184, 0.24)"
  text: "#F1F5FB"
  muted: "#93A2B8"
  dim: "#64748B"
  accent: "#818CF8"
  accent_strong: "#6366F1"

include: ['_pages']
exclude: ['README.md', 'LICENSE', 'node_modules', 'Gemfile', 'Gemfile.lock', 'package.json', 'package-lock.json', 'tailwind.config.js', 'static/css/input.css', 'static/css/components.css']

excerpt_separator: <!--more-->

# -------------------------------------------------------
# Collections.
# -------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /:title/
  protos:
    output: true
    permalink: /:title/

# -------------------------------------------------------
# Defaults.
# -------------------------------------------------------

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "post"  
  - scope:
      path: ""
      type: "protos"
    values:
      layout: "post"

# -------------------------------------------------------
# Markdown.
# -------------------------------------------------------

kramdown:
  input: GFM
  parse_block_html: true
  parse_span_html: true

# -------------------------------------------------------
# Code.
# -------------------------------------------------------

highlighter: rouge

# -------------------------------------------------------
# Plugins.
# -------------------------------------------------------

plugins:
  - jekyll-redirect-from
