title: Damien Mayance (Valryon)

# -------------------------------------------------------
# Globals.
# -------------------------------------------------------

show_drafts: nil
permalink: /:title/

include: ['_pages']
exclude: ['README.md', 'LICENSE', 'node_modules', 'Gemfile', 'Gemfile.lock', 'package.json', 'package-lock.json', 'tailwind.config.js', 'static/css/input.css', 'static/css/components.css']

excerpt_separator: <!--more-->

# -------------------------------------------------------
# Collections.
# -------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /:title/
  protos:
    output: true
    permalink: /:title/

# -------------------------------------------------------
# Defaults.
# -------------------------------------------------------

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "post"  
  - scope:
      path: ""
      type: "protos"
    values:
      layout: "post"

# -------------------------------------------------------
# Markdown.
# -------------------------------------------------------

kramdown:
  input: GFM
  parse_block_html: true
  parse_span_html: true

# -------------------------------------------------------
# Code.
# -------------------------------------------------------

highlighter: rouge

# -------------------------------------------------------
# Plugins.
# -------------------------------------------------------

plugins:
  - jekyll-redirect-from
