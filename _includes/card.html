<a href="{{ include.url }}" class="card{% if include.featured %} card-featured{% endif %}">
    <img class="cover" src="{{ site.url }}/{{ include.image | default: include.fallback_image }}" alt="{{ include.title }}" loading="lazy" />
    <div class="card-body">
        <div class="card-top">
            <h2 class="card-title">{{ include.title }}</h2>
            <span class="year">{{ include.year }}</span>
        </div>
        <span class="role">{{ include.role }}</span>
        <p class="desc">{{ include.shortdesc }}</p>
    </div>
</a>
